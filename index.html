  .roi-status { display: flex; align-items: center; gap: 8px; margin-top: 10px; }

  /* commission slider table */
  .commission-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  .commission-table th { color: #a8b4bc; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 6px 12px; text-align: left; border-bottom: 1px solid #dde3e7; }
  .commission-table td { padding: 10px 12px; border-bottom: 1px solid #dde3e7; color: #4a6070; }
  .commission-table tr:last-child td { border-bottom: none; }
  .commission-table tr.active-tier td { background: #e8f3f9; color: #0a2d4d; font-weight: 700; }
  .commission-table tr.active-tier td:first-child { border-left: 3px solid #8fbcd4; padding-left: 9px; }
  .tier-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }

  /* commission split visual */

<body>
<div class="wrap" id="app"></div>
<div class="footer">Thermi 800 sqm · Live Financial Model · Dynamic Commission Structure</div>

<script>
const C = {
  navy:'#0a2d4d', navyMid:'#0d3a61', steel:'#7d8a96', steelLight:'#a8b4bc',
  steelXLight:'#dde3e7', sky:'#8fbcd4', skyLight:'#b8d6e8', skyXLight:'#e8f3f9',
  white:'#ffffff', green:'#2e7d5e', red:'#b83232',
};

const fmt  = n => '€' + Math.round(n).toLocaleString('en-US');
const pct  = n => (n*100).toFixed(1)+'%';
const pct1 = n => (n*100).toFixed(2)+'%';
const uid  = () => Math.random().toString(36).slice(2,8);
const sumExtra = arr => (arr||[]).reduce((s,r)=>s+(r.value||0),0);
const clamp = (v,mn,mx) => Math.min(mx,Math.max(mn,v));

// ── state ────────────────────────────────────────────────────────────────────
let state = {
  tab: 'overview',
  landCosts:         { propertyPrice:400000, purchaseTax:12360, landRegistry:2000, brokerFee:8000, engineerInspection:400, demolition:0, extra:[] },
  generalCosts:      { notary:3500, translationDocuments:1000, lawyer:4000, unexpected:41062.5, soulSpace:20000, incorporationCost:6000, flightsAccommodation:5000, projectManagement:146000, extra:[] },
  constructionCosts: { sqm:730, costPerM:1250, furniture:0, extra:[] },
  fundingCosts:      { financing:0, financingRate:0.045, extra:[] },
  sales:             { firstFloor:{pricePerSqm:2750,sqm:292}, secondFloor:{pricePerSqm:2650,sqm:292}, thirdFloor:{pricePerSqm:2650,sqm:146}, extra:[] },
  fees:              { sellingCostRate:0.07 },
  investor:          { count:7, taxRate:0.22 },
  // Dynamic commission parameters
  commission: {
    roiTarget:      0.35,   // 35% — the guaranteed floor for investors
    baseRate:       0.05,   // 5% FH rate at exactly target ROI
    minRate:        0.02,   // floor: rate if ROI is 0% or below
    maxRate:        0.10,   // ceiling: rate at maxROI and above
    maxROI:         0.60,   // ROI at which FH earns max commission
  },
};

// ── Dynamic commission calculation ───────────────────────────────────────────
// Below target: FH rate slides linearly from minRate (at ROI=0) to baseRate (at ROI=target)
// Above target: FH rate slides linearly from baseRate (at ROI=target) to maxRate (at ROI=maxROI)
// The trick: FH commission is taken AFTER the investor's target return is secured first.
// We solve iteratively: FH% affects totalSales → profit → investorROI → FH% (converges in ~5 steps)

function computeDynamicFHRate(salesGross, totalExpenses, capitalForProject, comm) {
  // Iteratively find the FH rate that satisfies the dynamic structure
  // Start with baseRate guess, iterate
  let fhRate = comm.baseRate;
  for (let i = 0; i < 20; i++) {
    const sellingCost = salesGross * state.fees.sellingCostRate;
    const freshHoldings = salesGross * fhRate;
    const totalSales = salesGross - sellingCost - freshHoldings;
    const totalProfit = totalSales - totalExpenses;
    const roi = capitalForProject > 0 ? totalProfit / capitalForProject : 0;
    // compute what rate should be at this roi
    let targetRate;
    if (roi <= 0) {
      targetRate = comm.minRate;
    } else if (roi < comm.roiTarget) {
      // linear: minRate → baseRate as roi goes 0 → roiTarget
      targetRate = comm.minRate + (comm.baseRate - comm.minRate) * (roi / comm.roiTarget);
    } else if (roi <= comm.maxROI) {
      // linear: baseRate → maxRate as roi goes roiTarget → maxROI
      targetRate = comm.baseRate + (comm.maxRate - comm.baseRate) * ((roi - comm.roiTarget) / (comm.maxROI - comm.roiTarget));
    } else {
      targetRate = comm.maxRate;
    }
    if (Math.abs(targetRate - fhRate) < 0.0001) break;
    fhRate = targetRate;
  }
  return clamp(fhRate, comm.minRate, comm.maxRate);
}

function compute() {
  const d = state;
  const land = d.landCosts.propertyPrice + d.landCosts.purchaseTax + d.landCosts.landRegistry
             + d.landCosts.brokerFee + d.landCosts.engineerInspection + d.landCosts.demolition + sumExtra(d.landCosts.extra);
  const general = d.generalCosts.notary + d.generalCosts.translationDocuments + d.generalCosts.lawyer
                + d.generalCosts.unexpected + d.generalCosts.soulSpace + d.generalCosts.incorporationCost
                + d.generalCosts.flightsAccommodation + d.generalCosts.projectManagement + sumExtra(d.generalCosts.extra);
  const construction = d.constructionCosts.sqm * d.constructionCosts.costPerM + d.constructionCosts.furniture + sumExtra(d.constructionCosts.extra);
  const funding = d.fundingCosts.financing + sumExtra(d.fundingCosts.extra);
  const totalExpenses = land + general + construction + funding;
  const capitalForProject = land + d.landCosts.landRegistry;

  const salesGross = d.sales.firstFloor.pricePerSqm*d.sales.firstFloor.sqm
                   + d.sales.secondFloor.pricePerSqm*d.sales.secondFloor.sqm
                   + d.sales.thirdFloor.pricePerSqm*d.sales.thirdFloor.sqm + sumExtra(d.sales.extra);

  // Dynamic FH rate
  const fhRate = computeDynamicFHRate(salesGross, totalExpenses, capitalForProject, d.commission);

  const sellingCost   = salesGross * d.fees.sellingCostRate;
  const freshHoldings = salesGross * fhRate;
  const totalSales    = salesGross - sellingCost - freshHoldings;
  const totalProfit   = totalSales - totalExpenses;

  const allSqm = d.sales.firstFloor.sqm + d.sales.secondFloor.sqm + d.sales.thirdFloor.sqm;
  const avgPriceSqm = allSqm > 0 ? Math.round(salesGross/allSqm) : 0;

  const investmentPerInvestor = capitalForProject / d.investor.count;
  const investorProfitGross   = totalProfit / d.investor.count;
  const investorProfitNet     = investorProfitGross * (1 - d.investor.taxRate);
  const profitToCapitalGross  = capitalForProject ? totalProfit / capitalForProject : 0;

  // What ROI would be at base rate (for comparison)
  const freshHoldingsBase = salesGross * d.commission.baseRate;
  const totalSalesBase    = salesGross - sellingCost - freshHoldingsBase;
  const totalProfitBase   = totalSalesBase - totalExpenses;
  const roiAtBase         = capitalForProject ? totalProfitBase / capitalForProject : 0;

  // ── Party totals ──
  // Soul Space: paid as a cost (soulSpace line) + earns sales commission (sellingCost = SS commission)
  const soulSpaceCost       = d.generalCosts.soulSpace;          // €20,000 cost line
  const soulSpaceCommission = sellingCost;                        // 7% of gross sales
  const soulSpaceTotal      = soulSpaceCost + soulSpaceCommission;// total SS earns from project

  // Fresh Holdings: earns project management fee + dynamic sales commission
  const fhProjectMgmt  = d.generalCosts.projectManagement;       // €146,000 management fee
  const fhSalesComm    = freshHoldings;                           // dynamic % of gross sales
  const fhTotal        = fhProjectMgmt + fhSalesComm;            // total FH earns from project

  return {
    land, general, construction, funding, totalExpenses, capitalForProject,
    salesGross, sellingCost, freshHoldings, fhRate, totalSales, totalProfit, avgPriceSqm,
    investmentPerInvestor, investorProfitGross, investorProfitNet, profitToCapitalGross,
    profitOverCost: totalExpenses ? totalProfit/totalExpenses : 0,
    profitOverSales: totalSales ? totalProfit/totalSales : 0,
    roiAtBase,
    soulSpaceCost, soulSpaceCommission, soulSpaceTotal,
    fhProjectMgmt, fhSalesComm, fhTotal,
  };
}

// ── Tier helpers ──────────────────────────────────────────────────────────────
function getTiers(comm) {
  return [
    { label: 'Below Floor',   roiMin: null,             roiMax: 0,               fhRate: comm.minRate,  cls:'tier-red',    desc:'ROI ≤ 0%' },
    { label: 'Below Target',  roiMin: 0,                roiMax: comm.roiTarget,  fhRate: null,          cls:'tier-yellow', desc:`0% → ${pct(comm.roiTarget)}`, sliding:true, from:comm.minRate, to:comm.baseRate },
    { label: 'At Target',     roiMin: comm.roiTarget,   roiMax: comm.roiTarget,  fhRate: comm.baseRate, cls:'tier-green',  desc:`Exactly ${pct(comm.roiTarget)}` },
    { label: 'Above Target',  roiMin: comm.roiTarget,   roiMax: comm.maxROI,     fhRate: null,          cls:'tier-gold',   desc:`${pct(comm.roiTarget)} → ${pct(comm.maxROI)}+`, sliding:true, from:comm.baseRate, to:comm.maxRate },
  ];
}

function getActiveTierIdx(roi, comm) {
  if (roi <= 0) return 0;
  if (roi < comm.roiTarget) return 1;
  if (Math.abs(roi - comm.roiTarget) < 0.001) return 2;
  return 3;
}

// ── render ───────────────────────────────────────────────────────────────────
function render() {
  const c  = compute();
  const pp = c.totalProfit > 0;
  document.getElementById('app').innerHTML = buildHTML(c, pp);
  bindEvents(c, pp);
}

// ── HTML helpers ─────────────────────────────────────────────────────────────
function editRow(id, label, value, prefix='€', note='', deletable=false) {
  const display = prefix + Math.round(value).toLocaleString('en-US');
  return `<div class="row" data-row="${id}">
    <span class="row-label">${label}${note?`<span class="row-note">(${note})</span>`:''}</span>
    <span class="row-value" data-edit="${id}" title="Click to edit">${display}</span>
    <input class="row-input" data-input="${id}" value="${value}" type="number">
    ${deletable?`<button class="del-btn" data-del="${id}" title="Remove">×</button>`:''}
  </div>`;
}
function staticRow(label, value, color='') {
  return `<div class="row"><span class="row-label">${label}</span><span class="row-static" style="color:${color||C.navy}">${value}</span></div>`;
}
function extraLinesHTML(rows, section, placeholder) {
  const rowsHTML = rows.map(r => editRow(`${section}__extra__${r.id}`,r.label,r.value,'€','',true)).join('');
  return `${rowsHTML}
    <div class="add-form" id="addform-${section}">
      <input class="lbl-input" id="addlbl-${section}" placeholder="${placeholder}" type="text">
      <input class="amt-input" id="addamt-${section}" placeholder="Amount" type="number">
      <button class="add-ok" data-addok="${section}">Add</button>
      <button class="add-cancel" data-addcancel="${section}">×</button>
    </div>
    <button class="add-line-btn" data-addbtn="${section}"><span style="font-size:16px">+</span> Add line</button>`;
}
function sectionHTML(title, accent, body) {
  return `<div class="section-card">
    <div class="section-head" style="background:linear-gradient(135deg,${accent}18 0%,#fff 100%);border-bottom:1px solid ${accent}30">
      <div class="section-bar" style="background:${accent}"></div>
      <span class="section-title">${title}</span>
    </div>
    <div class="section-body">${body}</div>
  </div>`;
}
function cardHTML(label, value, sub, accent, highlight) {
  const bg = highlight ? accent : '#fff';
  const border = highlight ? accent : C.steelXLight;
  const shadow = highlight ? `0 4px 18px ${accent}50` : '0 2px 8px rgba(10,45,77,.05)';
  return `<div class="metric-card${highlight?' highlight':''}" style="background:${bg};border-color:${border};box-shadow:${shadow}">
    <span class="mc-label">${label}</span>
    <span class="mc-value">${value}</span>

  </div>`;
}

      ${cardHTML('Soul Space Commission',fmt(c.sellingCost),pct(d.fees.sellingCostRate)+'  · SS sales','#0a7a6e',false)}
      ${cardHTML('FH Commission',fmt(c.freshHoldings),pct1(c.fhRate)+' · dynamic',C.sky,false)}
      ${cardHTML('Net Revenue',fmt(c.totalSales),'To project',C.navy,true)}
    </div>
    ${sectionHTML('Sales by Floor',C.navy,`
      ${floorHTML('First Floor','firstFloor')}
      ${floorHTML('Second Floor','secondFloor')}
      ${floorHTML('Third Floor','thirdFloor')}
      ${extraLinesHTML(d.sales.extra,'sales','e.g. Parking space')}
    `)}
    ${sectionHTML('Fees',C.steel,`
      <div class="fees-row">
        <div class="fees-col">${editRow('fees.sellingCostRate','Soul Space Commission Rate',Math.round(d.fees.sellingCostRate*100),'','%')}</div>
        <div class="fees-col">${staticRow('FH Commission Rate',pct1(c.fhRate)+' (dynamic)',C.sky)}</div>
      </div>
    `)}
  </div>`;

  // ── investor ──
  const investor = `<div class="tab-panel${d.tab==='investor'?' active':''}">
    <div class="cards-grid" style="margin-bottom:20px">
      ${cardHTML('# of Investors',d.investor.count,'',C.steel,false)}
      ${cardHTML('Investment / Investor',fmt(c.investmentPerInvestor),'',C.sky,false)}
      ${cardHTML('Profit / Investor (Gross)',fmt(c.investorProfitGross),'',C.navy,false)}
      ${cardHTML('Profit / Investor (Net)',fmt(c.investorProfitNet),'After '+Math.round(d.investor.taxRate*100)+'% tax',C.navy,true)}
    </div>
    ${sectionHTML('Investor Parameters',C.steel,`
      ${editRow('investor.count','Number of Investors',d.investor.count,'')}
      ${editRow('investor.taxRate_pct','Tax Rate',Math.round(d.investor.taxRate*100),'','%')}
    `)}
    ${sectionHTML('Returns Summary',C.navy,`
      <div class="returns-row"><span class="returns-label">Total Project Profit</span><span class="returns-val" style="color:${pp?C.green:C.red}">${fmt(c.totalProfit)}</span></div>
      <div class="returns-row"><span class="returns-label">Investor ROI (Gross)</span><span class="returns-val" style="color:${roi>=comm.roiTarget?C.green:C.red}">${pct(roi)} ${roi>=comm.roiTarget?'✓ above target':'⚠ below target'}</span></div>
      <div class="returns-row"><span class="returns-label">Target ROI</span><span class="returns-val" style="color:${C.navy}">${pct(comm.roiTarget)}</span></div>
      <div class="returns-row"><span class="returns-label">Capital Required</span><span class="returns-val" style="color:${C.navy}">${fmt(c.capitalForProject)}</span></div>
      <div class="returns-row"><span class="returns-label">Investment per Investor</span><span class="returns-val" style="color:${C.navyMid}">${fmt(c.investmentPerInvestor)}</span></div>
      <div class="returns-row"><span class="returns-label">Profit per Investor (Gross)</span><span class="returns-val" style="color:${C.green}">${fmt(c.investorProfitGross)}</span></div>
      <div class="returns-row"><span class="returns-label">Profit per Investor (Net)</span><span class="returns-val" style="color:${C.green}">${fmt(c.investorProfitNet)}</span></div>
      <div class="returns-row" style="background:#f0f7ff;margin:0 -18px;padding:9px 18px"><span class="returns-label" style="font-weight:700;color:#0a2d4d">FH: Project Mgmt</span><span class="returns-val" style="color:#2e7d5e">${fmt(c.fhProjectMgmt)}</span></div>
      <div class="returns-row" style="background:#f0f7ff;margin:0 -18px;padding:9px 18px"><span class="returns-label" style="font-weight:700;color:#0a2d4d">FH: Sales Commission (${pct1(c.fhRate)})</span><span class="returns-val" style="color:#0a2d4d">${fmt(c.fhSalesComm)}</span></div>
      <div class="returns-row" style="background:#e8f3f9;margin:0 -18px;padding:9px 18px;border-top:2px solid #b8d6e8"><span class="returns-label" style="font-weight:900;color:#0a2d4d">FH Total Earnings</span><span class="returns-val" style="color:#0a2d4d;font-size:15px">${fmt(c.fhTotal)}</span></div>
      <div class="returns-row" style="background:#f0faf8;margin:0 -18px;padding:9px 18px"><span class="returns-label" style="font-weight:700;color:#0a7a6e">SS: Cost Line</span><span class="returns-val" style="color:#b83232">${fmt(c.soulSpaceCost)}</span></div>
      <div class="returns-row" style="background:#f0faf8;margin:0 -18px;padding:9px 18px"><span class="returns-label" style="font-weight:700;color:#0a7a6e">SS: Sales Commission (${pct(d.fees.sellingCostRate)})</span><span class="returns-val" style="color:#0a7a6e">${fmt(c.soulSpaceCommission)}</span></div>
      <div class="returns-row" style="background:#e0f5f2;margin:0 -18px;padding:9px 18px;border-top:2px solid #0d9e8e44"><span class="returns-label" style="font-weight:900;color:#0a7a6e">Soul Space Total Earnings</span><span class="returns-val" style="color:#0a7a6e;font-size:15px">${fmt(c.soulSpaceTotal)}</span></div>
      <div class="returns-row"><span class="returns-label">Entrepreneur Net (after tax)</span><span class="returns-val" style="color:${C.sky}">${fmt(entNet)}</span></div>
    `)}
  </div>`;

  // ── commission tab ──
  const commissionTab = `<div class="tab-panel${d.tab==='commission'?' active':''}">
    ${commissionHero}
    ${sectionHTML('Tier Breakdown', C.navy, tierTable)}
    ${sectionHTML('Revenue Split at Current ROI', C.sky, splitVisual)}
    ${paramsSection}
  </div>`;

  return header + tabsHTML + `<div>${overview}${costs}${sales}${investor}${commissionTab}</div>`;
}

// ── bind events ───────────────────────────────────────────────────────────────
function bindEvents(c, pp) {
  // flow bar
  const bar = document.getElementById('flowbar');
  if (bar) {
    const segs = [
      {label:'Land',value:c.land,color:C.navy},
      {label:'General',value:c.general,color:C.steel},
      {label:'Construction',value:c.construction,color:C.sky},
      {label:'Funding',value:Math.max(c.funding,1),color:C.skyLight},
    ];
    const total = segs.reduce((s,i)=>s+i.value,0);
    bar.innerHTML = segs.map(s=>`<div class="flow-seg" style="flex:${s.value/total};background:${s.color}" title="${s.label}: ${fmt(s.value)}">${(s.value/total)>0.08?s.label:''}</div>`).join('');
  }

  // tabs
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => { state.tab = btn.dataset.tab; render(); });
  });

  // editable values
  document.querySelectorAll('[data-edit]').forEach(span => {
    span.addEventListener('click', () => {
      const id = span.dataset.edit;
      span.classList.add('editing');
      const input = document.querySelector(`[data-input="${id}"]`);
      if (input) { input.classList.add('visible'); input.focus(); input.select(); }
    });
  });
  document.querySelectorAll('[data-input]').forEach(input => {
    const id = input.dataset.input;
    const commit = () => {
      const val = parseFloat(input.value);
      if (!isNaN(val)) applyValue(id, val); else render();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();commit();} if(e.key==='Escape')render(); });
  });

  // delete
  document.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [sec,,rowId] = btn.dataset.del.split('__');
      if (sec==='sales') state.sales.extra = state.sales.extra.filter(r=>r.id!==rowId);
      else state[sec].extra = state[sec].extra.filter(r=>r.id!==rowId);
      render();
    });
  });

  // add line
  document.querySelectorAll('[data-addbtn]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sec = btn.dataset.addbtn;
      document.getElementById('addform-'+sec)?.classList.add('visible');
      btn.style.display='none';
      document.getElementById('addlbl-'+sec)?.focus();
    });
  });
  document.querySelectorAll('[data-addok]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sec = btn.dataset.addok;
      const lbl = document.getElementById('addlbl-'+sec)?.value.trim();
      const amt = parseFloat(document.getElementById('addamt-'+sec)?.value);
      if (lbl && !isNaN(amt)) {
        const row = {id:uid(),label:lbl,value:amt};
        if (sec==='sales') state.sales.extra.push(row); else state[sec].extra.push(row);
        render();
      }
    });
  });
  document.querySelectorAll('[data-addcancel]').forEach(btn => btn.addEventListener('click', render));
  document.querySelectorAll('.amt-input').forEach(input => {
    input.addEventListener('keydown', e => {
      if (e.key==='Enter') document.querySelector(`[data-addok="${input.id.replace('addamt-','')}"]`)?.click();
    });
  });

  // commission params
  ['roiTarget','baseRate','minRate','maxRate','maxROI'].forEach(key => {
    const el = document.getElementById('param-'+key);
    if (!el) return;
    const commit = () => {
      const v = parseFloat(el.value);
      if (!isNaN(v) && v >= 0 && v <= 100) {
        state.commission[key] = v / 100;
        render();
      }
    };
    el.addEventListener('blur', commit);
    el.addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();commit();} });
  });
}

// ── apply value ───────────────────────────────────────────────────────────────
function applyValue(id, val) {
  if (id.includes('__extra__')) {
    const [sec,,rowId] = id.split('__');
    const target = sec==='sales' ? state.sales.extra : state[sec].extra;
    const row = target.find(r=>r.id===rowId);
    if (row) row.value = val;
    render(); return;
  }
  if (id==='investor.taxRate_pct') { state.investor.taxRate=val/100; render(); return; }
  if (id==='fees.sellingCostRate') { state.fees.sellingCostRate=val/100; render(); return; }
  if (id==='investor.count') { state.investor.count=Math.max(1,Math.round(val)); render(); return; }
  const keys = id.split('.');
  let cur = state;
  for (let i=0;i<keys.length-1;i++) cur=cur[keys[i]];
  cur[keys[keys.length-1]] = val;
  render();
}

render();
</script>
