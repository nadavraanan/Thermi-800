<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thermi · 800 sqm Plot — Financial Model</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Lato', 'Trebuchet MS', sans-serif; background: #f2f5f7; color: #0a2d4d; min-height: 100vh; padding: 28px 16px; }

  /* ── layout ── */
  .wrap { max-width: 900px; margin: 0 auto; }

  /* ── header ── */
  .header { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 24px; }
  .header-left .eyebrow { font-size: 10px; color: #8fbcd4; font-weight: 800; letter-spacing: .18em; margin-bottom: 6px; }
  .header-left h1 { font-size: 30px; font-weight: 900; color: #0a2d4d; letter-spacing: -.02em; line-height: 1.1; }
  .header-left .subtitle { color: #a8b4bc; font-size: 12px; margin-top: 6px; font-style: italic; }
  .profit-box { background: #e8f5ef; border: 1px solid #a3d4bf; border-radius: 14px; padding: 14px 24px; text-align: right; box-shadow: 0 2px 10px rgba(10,45,77,.07); }
  .profit-box.loss { background: #fdf0f0; border-color: #e8b4b4; }
  .profit-box .pb-label { color: #a8b4bc; font-size: 10px; font-weight: 800; letter-spacing: .12em; }
  .profit-box .pb-value { font-size: 28px; font-weight: 900; letter-spacing: -.02em; margin-top: 2px; color: #2e7d5e; }
  .profit-box.loss .pb-value { color: #b83232; }
  .profit-box .pb-sub { color: #a8b4bc; font-size: 11px; margin-top: 2px; }

  /* ── flow bar ── */
  .bar-label { color: #a8b4bc; font-size: 10px; font-weight: 800; letter-spacing: .12em; margin-bottom: 8px; }
  .flow-bar { display: flex; border-radius: 10px; overflow: hidden; height: 36px; gap: 2px; }
  .flow-seg { display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 700; overflow: hidden; white-space: nowrap; min-width: 2px; transition: flex .4s; }
  .bar-legend { display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #7d8a96; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* ── tabs ── */
  .tabs { display: flex; gap: 3px; background: #dde3e7; border-radius: 11px; padding: 4px; width: fit-content; margin-bottom: 20px; }
  .tab-btn { background: transparent; border: none; border-radius: 8px; color: #7d8a96; padding: 8px 22px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; transition: all .15s; }
  .tab-btn.active { background: #0a2d4d; color: #fff; box-shadow: 0 2px 8px rgba(10,45,77,.25); }

  /* ── tab content ── */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── metric cards ── */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .metric-card { background: #fff; border: 1px solid #dde3e7; border-radius: 13px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 8px rgba(10,45,77,.05); }
  .metric-card.highlight { color: #fff; }
  .metric-card .mc-label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #7d8a96; }
  .metric-card.highlight .mc-label { color: rgba(255,255,255,.75); }
  .metric-card .mc-value { font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #0a2d4d; }
  .metric-card.highlight .mc-value { color: #fff; }
  .metric-card .mc-sub { font-size: 11px; color: #a8b4bc; }
  .metric-card.highlight .mc-sub { color: rgba(255,255,255,.6); }

  /* ── section card ── */
  .section-card { background: #fff; border-radius: 14px; border: 1px solid #dde3e7; overflow: hidden; margin-bottom: 18px; box-shadow: 0 2px 8px rgba(10,45,77,.06); }
  .section-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid rgba(0,0,0,.06); }
  .section-bar { width: 4px; height: 20px; border-radius: 2px; flex-shrink: 0; }
  .section-title { font-weight: 700; font-size: 14px; color: #0a2d4d; }
  .section-body { padding: 4px 18px 14px; }

  /* ── two-col grid ── */
  .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }

  /* ── rows ── */
  .row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #dde3e7; gap: 8px; }
  .row:last-child { border-bottom: none; }
  .row-label { color: #4a6070; font-size: 13px; flex: 1; }
  .row-note { color: #a8b4bc; font-size: 11px; margin-left: 6px; }
  .row-value { color: #0d3a61; font-weight: 600; font-size: 13px; cursor: pointer; background: #e8f3f9; border-radius: 7px; padding: 4px 11px; border: 1px solid #b8d6e8; min-width: 95px; text-align: right; transition: background .15s; white-space: nowrap; }
  .row-value:hover { background: #d4ecf7; }
  .row-value.editing { display: none; }
  .row-input { background: #fff; border: 2px solid #8fbcd4; border-radius: 7px; color: #0a2d4d; padding: 3px 8px; width: 110px; text-align: right; font-size: 13px; font-family: inherit; outline: none; box-shadow: 0 0 0 3px rgba(184,214,232,.4); display: none; }
  .row-input.visible { display: block; }
  .del-btn { background: none; border: none; cursor: pointer; color: #a8b4bc; font-size: 18px; line-height: 1; padding: 0 2px; flex-shrink: 0; }
  .del-btn:hover { color: #b83232; }

  /* static row (non-editable computed) */
  .row-static { color: #0a2d4d; font-weight: 800; font-size: 13px; white-space: nowrap; }

  /* ── add-line UI ── */
  .add-line-btn { margin-top: 8px; background: none; border: 1px dashed #b8d6e8; border-radius: 7px; padding: 6px 14px; cursor: pointer; color: #8fbcd4; font-family: inherit; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 5px; transition: all .15s; }
  .add-line-btn:hover { background: #e8f3f9; }
  .add-form { display: none; align-items: center; gap: 6px; padding: 10px 0; border-bottom: 1px solid #dde3e7; }
  .add-form.visible { display: flex; }
  .add-form input { background: #fff; border: 1px solid #8fbcd4; border-radius: 7px; padding: 5px 8px; font-size: 13px; font-family: inherit; color: #0a2d4d; outline: none; }
  .add-form .lbl-input { flex: 1; }
  .add-form .amt-input { width: 100px; text-align: right; }
  .add-form .add-ok { background: #0a2d4d; color: #fff; border: none; border-radius: 7px; padding: 5px 12px; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 12px; }
  .add-form .add-cancel { background: none; border: none; cursor: pointer; color: #a8b4bc; font-size: 18px; }

  /* ── waterfall ── */
  .wf-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #dde3e7; font-size: 13px; }
  .wf-row.bold .wf-label { font-weight: 700; color: #0a2d4d; }
  .wf-row.highlight { border-top: 2px solid #dde3e7; border-bottom: none; padding-top: 12px; }
  .wf-label { color: #4a6070; }
  .wf-val { font-weight: 500; }
  .wf-val.pos { color: #2e7d5e; }
  .wf-val.neg { color: #b83232; }
  .wf-val.bold-val { font-weight: 800; font-size: 16px; }

  /* ── investor returns table ── */
  .returns-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #dde3e7; font-size: 13px; }
  .returns-label { color: #4a6070; }
  .returns-val { font-weight: 700; }

  /* ── floor sales ── */
  .floor-block { padding: 12px 0; border-bottom: 1px solid #dde3e7; }
  .floor-block:last-child { border-bottom: none; }
  .floor-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .floor-name { font-weight: 700; font-size: 13px; color: #0a2d4d; }
  .floor-total { font-weight: 800; font-size: 14px; color: #2e7d5e; }
  .floor-fields { display: flex; gap: 12px; flex-wrap: wrap; }
  .floor-field { flex: 1; min-width: 180px; }

  /* ── fees row ── */
  .fees-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .fees-col { flex: 1; min-width: 220px; }

  /* ── footer ── */
  .footer { max-width: 900px; margin: 20px auto 0; text-align: center; color: #dde3e7; font-size: 10px; }
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="footer">Thermi 800 sqm · Live Financial Model · All values editable</div>

<script>
// ── palette ──────────────────────────────────────────────────────────────────
const C = {
  navy:'#0a2d4d', navyMid:'#0d3a61', steel:'#7d8a96', steelLight:'#a8b4bc',
  steelXLight:'#dde3e7', sky:'#8fbcd4', skyLight:'#b8d6e8', skyXLight:'#e8f3f9',
  white:'#ffffff', green:'#2e7d5e', red:'#b83232',
};

// ── helpers ──────────────────────────────────────────────────────────────────
const fmt = n => '€' + Math.round(n).toLocaleString('en-US');
const pct = n => (n*100).toFixed(1)+'%';
const uid = () => Math.random().toString(36).slice(2,8);
const sumExtra = arr => (arr||[]).reduce((s,r)=>s+(r.value||0),0);

// ── state ────────────────────────────────────────────────────────────────────
let state = {
  tab: 'overview',
  landCosts:        { propertyPrice:400000, purchaseTax:12360, landRegistry:2000, brokerFee:8000, engineerInspection:400, demolition:0, extra:[] },
  generalCosts:     { notary:3500, translationDocuments:1000, lawyer:4000, unexpected:41062.5, soulSpace:20000, incorporationCost:6000, flightsAccommodation:5000, projectManagement:146000, extra:[] },
  constructionCosts:{ sqm:730, costPerM:1250, furniture:0, extra:[] },
  fundingCosts:     { financing:0, financingRate:0.045, extra:[] },
  sales:            { firstFloor:{pricePerSqm:2750,sqm:292}, secondFloor:{pricePerSqm:2650,sqm:292}, thirdFloor:{pricePerSqm:2650,sqm:146}, extra:[] },
  fees:             { sellingCostRate:0.07, freshHoldingsRate:0.05 },
  investor:         { count:7, taxRate:0.22 },
};

// ── compute ──────────────────────────────────────────────────────────────────
function compute() {
  const d = state;
  const land = d.landCosts.propertyPrice + d.landCosts.purchaseTax + d.landCosts.landRegistry
             + d.landCosts.brokerFee + d.landCosts.engineerInspection + d.landCosts.demolition + sumExtra(d.landCosts.extra);
  const general = d.generalCosts.notary + d.generalCosts.translationDocuments + d.generalCosts.lawyer
                + d.generalCosts.unexpected + d.generalCosts.soulSpace + d.generalCosts.incorporationCost
                + d.generalCosts.flightsAccommodation + d.generalCosts.projectManagement + sumExtra(d.generalCosts.extra);
  const construction = d.constructionCosts.sqm * d.constructionCosts.costPerM + d.constructionCosts.furniture + sumExtra(d.constructionCosts.extra);
  const funding = d.fundingCosts.financing + sumExtra(d.fundingCosts.extra);
  const totalExpenses = land + general + construction + funding;
  const capitalForProject = land + d.landCosts.landRegistry;
  const salesGross = d.sales.firstFloor.pricePerSqm*d.sales.firstFloor.sqm
                   + d.sales.secondFloor.pricePerSqm*d.sales.secondFloor.sqm
                   + d.sales.thirdFloor.pricePerSqm*d.sales.thirdFloor.sqm + sumExtra(d.sales.extra);
  const sellingCost = salesGross * d.fees.sellingCostRate;
  const freshHoldings = salesGross * d.fees.freshHoldingsRate;
  const totalSales = salesGross - sellingCost - freshHoldings;
  const totalProfit = totalSales - totalExpenses;
  const allSqm = d.sales.firstFloor.sqm + d.sales.secondFloor.sqm + d.sales.thirdFloor.sqm;
  const avgPriceSqm = allSqm > 0 ? Math.round(salesGross/allSqm) : 0;
  const investmentPerInvestor = capitalForProject / d.investor.count;
  const investorProfitGross = totalProfit / d.investor.count;
  const investorProfitNet = investorProfitGross * (1 - d.investor.taxRate);
  const profitToCapitalGross = capitalForProject ? totalProfit/capitalForProject : 0;
  return { land, general, construction, funding, totalExpenses, capitalForProject,
           salesGross, sellingCost, freshHoldings, totalSales, totalProfit, avgPriceSqm,
           investmentPerInvestor, investorProfitGross, investorProfitNet, profitToCapitalGross,
           profitOverCost: totalExpenses ? totalProfit/totalExpenses : 0,
           profitOverSales: totalSales ? totalProfit/totalSales : 0 };
}

// ── render ───────────────────────────────────────────────────────────────────
function render() {
  const c = compute();
  const pp = c.totalProfit > 0;
  const app = document.getElementById('app');
  app.innerHTML = buildHTML(c, pp);
  bindEvents(c, pp);
}

// ── editable row HTML ─────────────────────────────────────────────────────────
function editRow(id, label, value, prefix='€', note='', deletable=false) {
  const display = prefix + Math.round(value).toLocaleString('en-US');
  return `
  <div class="row" data-row="${id}">
    <span class="row-label">${label}${note ? `<span class="row-note">(${note})</span>` : ''}</span>
    <span class="row-value" data-edit="${id}" title="Click to edit">${display}</span>
    <input class="row-input" data-input="${id}" value="${value}" type="number">
    ${deletable ? `<button class="del-btn" data-del="${id}" title="Remove">×</button>` : ''}
  </div>`;
}

function staticRow(label, value, color='') {
  return `<div class="row"><span class="row-label">${label}</span><span class="row-static" style="color:${color||C.navy}">${value}</span></div>`;
}

// ── extra lines HTML ──────────────────────────────────────────────────────────
function extraLinesHTML(rows, section, placeholder) {
  const rowsHTML = rows.map(r => editRow(`${section}__extra__${r.id}`, r.label, r.value, '€', '', true)).join('');
  return `
    ${rowsHTML}
    <div class="add-form" id="addform-${section}">
      <input class="lbl-input" id="addlbl-${section}" placeholder="${placeholder}" type="text">
      <input class="amt-input" id="addamt-${section}" placeholder="Amount" type="number">
      <button class="add-ok" data-addok="${section}">Add</button>
      <button class="add-cancel" data-addcancel="${section}">×</button>
    </div>
    <button class="add-line-btn" data-addbtn="${section}"><span style="font-size:16px">+</span> Add line</button>`;
}

// ── section HTML ──────────────────────────────────────────────────────────────
function sectionHTML(title, accent, body) {
  return `
  <div class="section-card">
    <div class="section-head" style="background:linear-gradient(135deg,${accent}18 0%,#fff 100%);border-bottom:1px solid ${accent}30">
      <div class="section-bar" style="background:${accent}"></div>
      <span class="section-title">${title}</span>
    </div>
    <div class="section-body">${body}</div>
  </div>`;
}

// ── metric card HTML ──────────────────────────────────────────────────────────
function cardHTML(label, value, sub, accent, highlight) {
  const bg = highlight ? accent : '#fff';
  const border = highlight ? accent : C.steelXLight;
  const shadow = highlight ? `0 4px 18px ${accent}50` : '0 2px 8px rgba(10,45,77,.05)';
  return `
  <div class="metric-card${highlight?' highlight':''}" style="background:${bg};border-color:${border};box-shadow:${shadow}">
    <span class="mc-label">${label}</span>
    <span class="mc-value">${value}</span>
    ${sub ? `<span class="mc-sub">${sub}</span>` : ''}
  </div>`;
}

// ── build full HTML ───────────────────────────────────────────────────────────
function buildHTML(c, pp) {
  const d = state;
  const tabs = ['overview','costs','sales','investor'];

  // header
  const header = `
  <div class="header">
    <div class="header-left">
      <div class="eyebrow">REAL ESTATE ANALYSIS</div>
      <h1>Thermi · 800 sqm Plot</h1>
      <div class="subtitle">Click values to edit · + Add line to extend any section</div>
    </div>
    <div class="profit-box${pp?'':' loss'}">
      <div class="pb-label">NET PROJECT PROFIT</div>
      <div class="pb-value">${fmt(c.totalProfit)}</div>
      <div class="pb-sub">${pct(c.profitOverSales)} of sales</div>
    </div>
  </div>
  <div style="margin-bottom:28px">
    <div class="bar-label">COST BREAKDOWN</div>
    <div class="flow-bar" id="flowbar"></div>
    <div class="bar-legend">
      <div class="legend-item"><div class="legend-dot" style="background:${C.navy}"></div>Land: <strong style="color:#4a6070;margin-left:3px">${fmt(c.land)}</strong></div>
      <div class="legend-item"><div class="legend-dot" style="background:${C.steel}"></div>General: <strong style="color:#4a6070;margin-left:3px">${fmt(c.general)}</strong></div>
      <div class="legend-item"><div class="legend-dot" style="background:${C.sky}"></div>Construction: <strong style="color:#4a6070;margin-left:3px">${fmt(c.construction)}</strong></div>
    </div>
  </div>`;

  // tabs
  const tabsHTML = `<div class="tabs">${tabs.map(t=>`<button class="tab-btn${t===d.tab?' active':''}" data-tab="${t}">${t}</button>`).join('')}</div>`;

  // ── overview ──
  const overview = `
  <div class="tab-panel${d.tab==='overview'?' active':''}">
    <div class="cards-grid">
      ${cardHTML('Total Expenses', fmt(c.totalExpenses), 'All cost categories', C.navy, false)}
      ${cardHTML('Total Revenue', fmt(c.totalSales), 'After selling costs & fees', C.green, false)}
      ${cardHTML('Capital Required', fmt(c.capitalForProject), 'Upfront investment needed', C.sky, false)}
      ${cardHTML('ROI (Gross)', pct(c.profitToCapitalGross), 'Return on capital', C.navy, true)}
    </div>
    <div class="cards-grid" style="margin-bottom:20px">
      ${cardHTML('Profit / Cost', pct(c.profitOverCost), 'Net profit over total cost', C.steel, false)}
      ${cardHTML('Profit / Sales', pct(c.profitOverSales), 'Net margin on revenue', C.sky, false)}
      ${cardHTML('Avg Price / sqm', '€'+c.avgPriceSqm.toLocaleString(), 'Weighted across floors', C.sky, false)}
      ${cardHTML('Build Area', d.constructionCosts.sqm+' m²', '@€'+d.constructionCosts.costPerM+'/m²', C.steel, false)}
    </div>
    ${sectionHTML('Profit Waterfall', C.navy, `
      <div class="wf-row"><span class="wf-label">Gross Sales</span><span class="wf-val pos">${fmt(c.salesGross)}</span></div>
      <div class="wf-row"><span class="wf-label">− Selling Costs (7%)</span><span class="wf-val neg">-${fmt(c.sellingCost)}</span></div>
      <div class="wf-row"><span class="wf-label">− Fresh Holdings (5%)</span><span class="wf-val neg">-${fmt(c.freshHoldings)}</span></div>
      <div class="wf-row bold"><span class="wf-label">= Total Revenue</span><span class="wf-val pos">${fmt(c.totalSales)}</span></div>
      <div class="wf-row"><span class="wf-label">− Land Costs</span><span class="wf-val neg">-${fmt(c.land)}</span></div>
      <div class="wf-row"><span class="wf-label">− General Costs</span><span class="wf-val neg">-${fmt(c.general)}</span></div>
      <div class="wf-row"><span class="wf-label">− Construction Costs</span><span class="wf-val neg">-${fmt(c.construction)}</span></div>
      <div class="wf-row bold highlight"><span class="wf-label">= Net Project Profit</span><span class="wf-val bold-val ${pp?'pos':'neg'}">${fmt(c.totalProfit)}</span></div>
    `)}
  </div>`;

  // ── costs ──
  const costs = `
  <div class="tab-panel${d.tab==='costs'?' active':''}">
    <div class="two-col">
      <div>
        ${sectionHTML('Land Costs · '+fmt(c.land), C.navy, `
          ${editRow('landCosts.propertyPrice','Property Price',d.landCosts.propertyPrice,'€','800 sqm @ €500/sqm')}
          ${editRow('landCosts.purchaseTax','Purchase Tax (FMA)',d.landCosts.purchaseTax,'€','3.09%')}
          ${editRow('landCosts.landRegistry','Land Registry',d.landCosts.landRegistry)}
          ${editRow('landCosts.brokerFee','Broker Fee',d.landCosts.brokerFee,'€','2%')}
          ${editRow('landCosts.engineerInspection','Engineer Inspection',d.landCosts.engineerInspection)}
          ${editRow('landCosts.demolition','Demolition',d.landCosts.demolition)}
          ${extraLinesHTML(d.landCosts.extra,'landCosts','e.g. Survey fee')}
        `)}
        ${sectionHTML('Construction · '+fmt(c.construction), C.sky, `
          ${editRow('constructionCosts.sqm','Build Area (sqm)',d.constructionCosts.sqm,'')}
          ${editRow('constructionCosts.costPerM','Cost per m²',d.constructionCosts.costPerM)}
          ${staticRow('Contractor Total', fmt(d.constructionCosts.sqm*d.constructionCosts.costPerM))}
          ${editRow('constructionCosts.furniture','Furniture',d.constructionCosts.furniture,'€','No need')}
          ${extraLinesHTML(d.constructionCosts.extra,'constructionCosts','e.g. HVAC upgrade')}
        `)}
      </div>
      <div>
        ${sectionHTML('General Costs · '+fmt(c.general), C.steel, `
          ${editRow('generalCosts.projectManagement','Project Management',d.generalCosts.projectManagement,'€','€200/m²')}
          ${editRow('generalCosts.unexpected','Unexpected (4.5%)',d.generalCosts.unexpected)}
          ${editRow('generalCosts.soulSpace','Soul Space',d.generalCosts.soulSpace,'€','5%')}
          ${editRow('generalCosts.incorporationCost','Incorporation Cost',d.generalCosts.incorporationCost)}
          ${editRow('generalCosts.flightsAccommodation','Flights & Accommodation',d.generalCosts.flightsAccommodation)}
          ${editRow('generalCosts.notary','Notary',d.generalCosts.notary,'€','~approximate')}
          ${editRow('generalCosts.lawyer','Lawyer',d.generalCosts.lawyer,'€','1%')}
          ${editRow('generalCosts.translationDocuments','Translation',d.generalCosts.translationDocuments)}
          ${extraLinesHTML(d.generalCosts.extra,'generalCosts','e.g. Marketing')}
        `)}
        ${sectionHTML('Funding Costs', C.skyLight, `
          ${editRow('fundingCosts.financing','Financing',d.fundingCosts.financing,'€','4.5% rate')}
          ${staticRow('Capital Required', fmt(c.capitalForProject))}
          ${extraLinesHTML(d.fundingCosts.extra,'fundingCosts','e.g. Guarantee fee')}
        `)}
      </div>
    </div>
  </div>`;

  // ── sales ──
  const floorHTML = (label, key) => {
    const fl = d.sales[key];
    return `
    <div class="floor-block">
      <div class="floor-header">
        <span class="floor-name">${label}</span>
        <span class="floor-total" id="floortotal-${key}">${fmt(fl.pricePerSqm*fl.sqm)}</span>
      </div>
      <div class="floor-fields">
        <div class="floor-field">${editRow(`sales.${key}.pricePerSqm`,'Price / sqm',fl.pricePerSqm)}</div>
        <div class="floor-field">${editRow(`sales.${key}.sqm`,'Area (sqm)',fl.sqm,'')}</div>
      </div>
    </div>`;
  };

  const sales = `
  <div class="tab-panel${d.tab==='sales'?' active':''}">
    <div class="cards-grid" style="margin-bottom:20px">
      ${cardHTML('Gross Sales', fmt(c.salesGross), '', C.navy, false)}
      ${cardHTML('Selling Costs', fmt(c.sellingCost), pct(d.fees.sellingCostRate), C.steel, false)}
      ${cardHTML('Fresh Holdings', fmt(c.freshHoldings), pct(d.fees.freshHoldingsRate), C.steel, false)}
      ${cardHTML('Net Revenue', fmt(c.totalSales), '', C.navy, true)}
    </div>
    ${sectionHTML('Sales by Floor', C.navy, `
      ${floorHTML('First Floor','firstFloor')}
      ${floorHTML('Second Floor','secondFloor')}
      ${floorHTML('Third Floor','thirdFloor')}
      ${extraLinesHTML(d.sales.extra,'sales','e.g. Parking space')}
    `)}
    ${sectionHTML('Fees & Deductions', C.steel, `
      <div class="fees-row">
        <div class="fees-col">${editRow('fees.sellingCostRate','Selling Cost Rate',Math.round(d.fees.sellingCostRate*100),'','%')}</div>
        <div class="fees-col">${editRow('fees.freshHoldingsRate','Fresh Holdings Rate',Math.round(d.fees.freshHoldingsRate*100),'','%')}</div>
      </div>
    `)}
  </div>`;

  // ── investor ──
  const investor = `
  <div class="tab-panel${d.tab==='investor'?' active':''}">
    <div class="cards-grid" style="margin-bottom:20px">
      ${cardHTML('# of Investors', d.investor.count, '', C.steel, false)}
      ${cardHTML('Investment / Investor', fmt(c.investmentPerInvestor), '', C.sky, false)}
      ${cardHTML('Profit / Investor (Gross)', fmt(c.investorProfitGross), '', C.navy, false)}
      ${cardHTML('Profit / Investor (Net)', fmt(c.investorProfitNet), 'After '+Math.round(d.investor.taxRate*100)+'% tax', C.navy, true)}
    </div>
    ${sectionHTML('Investor Parameters', C.steel, `
      ${editRow('investor.count','Number of Investors',d.investor.count,'')}
      ${editRow('investor.taxRate_pct','Tax Rate',Math.round(d.investor.taxRate*100),'','%')}
    `)}
    ${sectionHTML('Returns Summary', C.navy, `
      <div class="returns-row"><span class="returns-label">Total Project Profit</span><span class="returns-val" style="color:${pp?C.green:C.red}">${fmt(c.totalProfit)}</span></div>
      <div class="returns-row"><span class="returns-label">ROI on Capital (Gross)</span><span class="returns-val" style="color:${C.green}">${pct(c.profitToCapitalGross)}</span></div>
      <div class="returns-row"><span class="returns-label">Capital Required</span><span class="returns-val" style="color:${C.navy}">${fmt(c.capitalForProject)}</span></div>
      <div class="returns-row"><span class="returns-label">Investment per Investor</span><span class="returns-val" style="color:${C.navyMid}">${fmt(c.investmentPerInvestor)}</span></div>
      <div class="returns-row"><span class="returns-label">Profit per Investor (Gross)</span><span class="returns-val" style="color:${C.green}">${fmt(c.investorProfitGross)}</span></div>
      <div class="returns-row"><span class="returns-label">Profit per Investor (Net)</span><span class="returns-val" style="color:${C.green}">${fmt(c.investorProfitNet)}</span></div>
      <div class="returns-row"><span class="returns-label">Fresh Holdings Share</span><span class="returns-val" style="color:${C.steel}">${fmt(c.freshHoldings)}</span></div>
      <div class="returns-row"><span class="returns-label">Entrepreneur Net</span><span class="returns-val" style="color:${C.sky}">${fmt((c.totalProfit-c.freshHoldings)*(1-d.investor.taxRate))}</span></div>
    `)}
  </div>`;

  return header + tabsHTML + `<div>${overview}${costs}${sales}${investor}</div>`;
}

// ── bind events ───────────────────────────────────────────────────────────────
function bindEvents(c, pp) {
  // draw flow bar
  const bar = document.getElementById('flowbar');
  if (bar) {
    const segs = [
      {label:'Land', value:c.land, color:C.navy},
      {label:'General', value:c.general, color:C.steel},
      {label:'Construction', value:c.construction, color:C.sky},
      {label:'Funding', value:Math.max(c.funding,1), color:C.skyLight},
    ];
    const total = segs.reduce((s,i)=>s+i.value,0);
    bar.innerHTML = segs.map(s=>`<div class="flow-seg" style="flex:${s.value/total};background:${s.color}" title="${s.label}: ${fmt(s.value)}">${(s.value/total)>0.08?s.label:''}</div>`).join('');
  }

  // tab switching
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => { state.tab = btn.dataset.tab; render(); });
  });

  // editable values
  document.querySelectorAll('[data-edit]').forEach(span => {
    span.addEventListener('click', () => {
      const id = span.dataset.edit;
      const input = document.querySelector(`[data-input="${id}"]`);
      span.classList.add('editing');
      if (input) { input.classList.add('visible'); input.focus(); input.select(); }
    });
  });

  document.querySelectorAll('[data-input]').forEach(input => {
    const id = input.dataset.input;
    const commit = () => {
      const val = parseFloat(input.value);
      if (!isNaN(val)) applyValue(id, val);
      else render();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); commit(); } if (e.key==='Escape') render(); });
  });

  // delete extra lines
  document.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.del; // format: "section__extra__rowid"
      const [sec,,rowId] = id.split('__');
      if (sec === 'sales') {
        state.sales.extra = state.sales.extra.filter(r => r.id !== rowId);
      } else {
        state[sec].extra = state[sec].extra.filter(r => r.id !== rowId);
      }
      render();
    });
  });

  // add line buttons
  document.querySelectorAll('[data-addbtn]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sec = btn.dataset.addbtn;
      const form = document.getElementById('addform-'+sec);
      if (form) { form.classList.add('visible'); btn.style.display='none'; document.getElementById('addlbl-'+sec)?.focus(); }
    });
  });

  document.querySelectorAll('[data-addok]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sec = btn.dataset.addok;
      const lbl = document.getElementById('addlbl-'+sec)?.value.trim();
      const amt = parseFloat(document.getElementById('addamt-'+sec)?.value);
      if (lbl && !isNaN(amt)) {
        const row = { id: uid(), label: lbl, value: amt };
        if (sec === 'sales') state.sales.extra.push(row);
        else state[sec].extra.push(row);
        render();
      }
    });
  });

  document.querySelectorAll('[data-addcancel]').forEach(btn => {
    btn.addEventListener('click', () => render());
  });

  // allow pressing Enter in amount field to add
  document.querySelectorAll('.amt-input').forEach(input => {
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const sec = input.id.replace('addamt-','');
        document.querySelector(`[data-addok="${sec}"]`)?.click();
      }
    });
  });
}

// ── apply a value change ──────────────────────────────────────────────────────
function applyValue(id, val) {
  // handle extra row edits: "section__extra__rowId"
  if (id.includes('__extra__')) {
    const [sec,,rowId] = id.split('__');
    const target = sec==='sales' ? state.sales.extra : state[sec].extra;
    const row = target.find(r=>r.id===rowId);
    if (row) row.value = val;
    render(); return;
  }

  // special cases
  if (id === 'investor.taxRate_pct') { state.investor.taxRate = val/100; render(); return; }
  if (id === 'fees.sellingCostRate') { state.fees.sellingCostRate = val/100; render(); return; }
  if (id === 'fees.freshHoldingsRate') { state.fees.freshHoldingsRate = val/100; render(); return; }
  if (id === 'investor.count') { state.investor.count = Math.max(1,Math.round(val)); render(); return; }

  // deep path e.g. "landCosts.propertyPrice" or "sales.firstFloor.pricePerSqm"
  const keys = id.split('.');
  let cur = state;
  for (let i=0;i<keys.length-1;i++) cur=cur[keys[i]];
  cur[keys[keys.length-1]] = val;
  render();
}

// ── boot ─────────────────────────────────────────────────────────────────────
render();
</script>
